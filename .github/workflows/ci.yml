# Same check as `bash scripts/check.sh`. Switched off until the code is pushed to GitHub:
# remove the `if: false` line below to turn it on.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv python install 3.12
      - run: uv sync
      - run: bash scripts/check.sh
